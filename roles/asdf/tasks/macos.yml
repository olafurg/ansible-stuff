---
- name: Install asdf and dependencies
  homebrew:
    name:
      - coreutils
      - curl
      - asdf # Should be last, the others are dependencies
    state: present

- name: Ensure asdf initialization in ~/.zshrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    regexp: '^\\. .*asdf.*$'  # Match any existing asdf initialization line
    line: "\n. $(brew --prefix asdf)/libexec/asdf.sh"  # Replace it with the correct initialization
    state: present  # Ensure the line exists

- name: Create symlink for .asdfrc
  file:
    src: "{{ role_path }}/files/.asdfrc"
    dest: "{{ ansible_env.HOME }}/.asdfrc"
    state: link
    force: true
