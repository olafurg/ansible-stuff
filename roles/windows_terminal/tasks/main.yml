---
# Windows Terminal stores its configuration on the Windows side, inside the
# packaged-app sandbox. This role runs from WSL (the control environment for the
# windows11_workstation playbook) and writes across to the Windows filesystem
# via /mnt/c. See the playbook README for the full execution model.
#
# We MERGE our managed keys into the live settings.json rather than overwriting
# it: Windows Terminal auto-generates profiles (WSL distros, PowerShell, Git
# Bash) and tombstones any generated profile that is missing from the file, so a
# whole-file overwrite would make those profiles disappear for good.
- name: Configure Windows Terminal
  when: "'microsoft' in ansible_facts['kernel'] | lower"
  block:

    - name: Resolve the Windows Terminal LocalState directory
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          wslpath -u "$(cmd.exe /c echo %LOCALAPPDATA% | tr -d '\r')"
        chdir: /mnt/c
        executable: /bin/bash
      register: windows_terminal_localappdata
      changed_when: false

    - name: Set the Windows Terminal settings path
      ansible.builtin.set_fact:
        windows_terminal_settings: >-
          {{ windows_terminal_localappdata.stdout | trim
          }}/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json

    - name: Merge managed settings into Windows Terminal settings.json
      ansible.builtin.command:
        argv:
          - python3
          - "{{ role_path }}/files/merge_settings.py"
          - "{{ role_path }}/files/settings.json"
          - "{{ windows_terminal_settings }}"
      register: windows_terminal_merge
      changed_when: "'CHANGED' in windows_terminal_merge.stdout"
