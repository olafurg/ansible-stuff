---
# From here: https://developer.hashicorp.com/terraform/install#linux
- name: Check if Terraform is installed
  ansible.builtin.command: terraform --version
  register: terraform_check
  failed_when: false
  changed_when: false

- name: Download and install HashiCorp GPG key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    mode: '0644'
  args:
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg
  become: true
  changed_when: false
  when: terraform_check.rc != 0

- name: Add HashiCorp repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/hashicorp.list
    content: |
      deb [arch={{ ansible_facts['architecture'] | default('amd64') }} signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_facts['lsb']['codename'] | default('focal') }} main
    mode: '0644'
  when: terraform_check.rc != 0

- name: Install Terraform
  become: true
  ansible.builtin.apt:
    name: terraform
    state: present
    update_cache: true
  when: terraform_check.rc != 0
