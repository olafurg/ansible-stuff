---
- name: Install Ghostty on Debian/Ubuntu
  vars:
    ghostty_version: "1.0.1"
    ghostty_deb_url: "https://github.com/mkasberg/ghostty-ubuntu/releases/download/1.0.1-0-ppa1/ghostty_1.0.1-0.ppa1_amd64_22.04.deb"
  include_tasks: debian_ubuntu.yml
  when: ansible_facts['os_family'] in ['Debian', 'Ubuntu']

- name: Install Ghostty on macOS
  include_tasks: macos.yml
  when: ansible_facts['os_family'] in ['Darwin']

# Configure Ghostty for all OSes
- block:
    - name: Ensure the parent directory exists
      file:
        path: "{{ ansible_env.HOME }}/.config/ghostty"
        state: directory

    - name: Create symlink for config
      file:
        src: "{{ role_path }}/files/config"
        dest: "{{ ansible_env.HOME }}/.config/ghostty/config"
        state: link
        force: true
  when: ansible_facts['os_family'] in ['Debian', "Ubuntu", "Darwin"]