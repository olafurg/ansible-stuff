---
- name: Check if Ghostty is installed
  ansible.builtin.command: dpkg-query -W -f='${Status}' ghostty
  register: ghostty_installed
  failed_when: false
  changed_when: false

- name: Download Ghostty signing key
  become: true
  ansible.builtin.get_url:
    url: https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc
    dest: /tmp/ghostty-signing-key.asc
    mode: '0644'
  when: ghostty_installed.rc != 0

- name: Dearmor Ghostty signing key
  become: true
  ansible.builtin.command: gpg --dearmor -o /usr/share/keyrings/debian.griffo.io.gpg /tmp/ghostty-signing-key.asc
  args:
    creates: /usr/share/keyrings/debian.griffo.io.gpg
  when: ghostty_installed.rc != 0

- name: Add Ghostty apt repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian.griffo.io.list
    content: "deb [signed-by=/usr/share/keyrings/debian.griffo.io.gpg] https://debian.griffo.io/apt {{ ansible_facts['lsb']['codename'] }} main\n"
    mode: '0644'
  when: ghostty_installed.rc != 0

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: ghostty_installed.rc != 0

- name: Install Ghostty
  become: true
  ansible.builtin.apt:
    name: ghostty
    state: present
  when: ghostty_installed.rc != 0
