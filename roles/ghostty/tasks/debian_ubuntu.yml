---
# Don't check, always install -- for now
- name: Download Ghostty deb file
  ansible.builtin.get_url:
    url: https://github.com/mkasberg/ghostty-ubuntu/releases/download/1.0.1-0-ppa1/ghostty_1.0.1-0.ppa1_amd64_22.04.deb
    dest: /tmp/

- name: Install Ghostty deb file
  become: true
  ansible.builtin.shell: "dpkg -i /tmp/ghostty*.deb"

- name: Remove Ghostty deb file
  ansible.builtin.file:
    path: /tmp/ghostty*.deb
    state: absent
