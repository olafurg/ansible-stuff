---
- name: Check if Ghostty is installed
  ansible.builtin.shell: "dpkg-query -W -f='${Status}' ghostty 2>/dev/null | grep -q 'install ok installed'"
  register: ghostty_installed
  failed_when: false
  changed_when: false

- name: Add Ghostty debian.griffo.io signing key
  become: true
  ansible.builtin.shell: >
    curl -fsSL https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc
    | gpg --dearmor -o /usr/share/keyrings/debian.griffo.io.gpg
  args:
    creates: /usr/share/keyrings/debian.griffo.io.gpg
  when: ghostty_installed.rc != 0

- name: Add Ghostty apt repository
  become: true
  ansible.builtin.shell: >
    echo "deb [signed-by=/usr/share/keyrings/debian.griffo.io.gpg]
    https://debian.griffo.io/apt $(lsb_release -sc) main"
    | tee /etc/apt/sources.list.d/debian.griffo.io.list
  args:
    creates: /etc/apt/sources.list.d/debian.griffo.io.list
  when: ghostty_installed.rc != 0

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: ghostty_installed.rc != 0

- name: Install Ghostty
  become: true
  ansible.builtin.apt:
    name: ghostty
    state: present
  when: ghostty_installed.rc != 0
