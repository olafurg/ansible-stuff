---
- name: Check if 1Password is already installed
  ansible.builtin.command: dpkg-query -W -f='${Status}' 1password
  register: onepassword_app_installed  # noqa: var-naming
  failed_when: false
  changed_when: false

- name: Download 1Password deb file
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/debian/amd64/stable/1password-latest.deb
    dest: /tmp/
    mode: '0644'
  when: onepassword_app_installed.rc != 0

- name: Install 1Password deb file
  become: true
  ansible.builtin.apt:
    deb: /tmp/1password-latest.deb
  when: onepassword_app_installed.rc != 0
