---
- name: Pihole setup
  hosts: pihole
  become: yes

  roles:
  - oh_my_zsh

  tasks:
    - name: Ensure required packages are installed
      apt:
        name: 
          - vim
          - git
          - curl
          - htop
        state: latest
        update_cache: true

    - name: Get pihole installer
      get_url:
        url: https://install.pi-hole.net
        dest: /tmp/basic-install.sh

    - name: Install pihole
      become: yes
      command: bash /tmp/basic-install.sh

