---
- name: Pihole setup
  hosts: pihole

  roles:
  - base-packages-debian
  - git
  - oh_my_zsh
  - vim
  - tmux
  - cloudflared

  tasks:

    - name: Install unattended upgrades
      become: true
      apt:
        name:
        - unattended-upgrades
        state: present

    # To avoid DNS packet size errors after started to use CF Gateway for upstream.
    - name: Configure DNS packet size, create file if doesn't exist
      become: true
      ansible.builtin.lineinfile:
        path: /etc/dnsmasq.d/99-edns.conf
        line: edns-packet-max=1232
        state: present
        create: yes

    - name: Restart DNS service following the change above
      become: yes
      ansible.builtin.shell: pihole restartdns

