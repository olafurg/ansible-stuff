---
- name: Ensure Grafana base packages are installed
  become: true
  apt:
    name:
      - apt-transport-https
      - software-properties-common
      - wget
    state: present
    update_cache: yes

- name: Add Grafana signing key
  become: true
  ansible.builtin.apt_key:
    url: https://packages.grafana.com/gpg.key
    state: present

- name: Add their repository into sources list
  become: true
  ansible.builtin.apt_repository:
    repo: "deb https://packages.grafana.com/oss/deb stable main"
    state: present
    filename: grafana

- name: Install Grafana
  become: true
  apt:
    name: grafana
    state: latest
    update_cache: yes