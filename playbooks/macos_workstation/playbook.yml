---
- name: Set up macOS
  hosts: localhost

  # Base roles and non-Homebrew-Apps and/or apps which require config files to be arranged
  roles:
    - oh_my_zsh
    - git
    - ghostty
    - asdf
    - terraform
    - tmux
    - vim

  # Homebrew apps that require no config files to be arranged
  tasks:
    - name: Install Homebrew (no-cask) apps
      community.general.homebrew:
        name:
          - awscli
          - azure-cli
          - gh
          - htop
          - tree
          - wget
        state: present

    - name: Install Homebrew cask apps
      community.general.homebrew_cask:
        name:
          - 1password
          - brave-browser
          - discord
          - firefox
          - flux
          - font-jetbrains-mono
          - raycast
          - rectangle
          - shottr
          - signal
          - spotify
          - swift-shift
          - visual-studio-code
        state: present

    - name: Install Homebrew cask apps (arm64 only)
      community.general.homebrew_cask:
        name:
          - chatgpt
        state: present
      when: ansible_facts['architecture'] == "arm64"

    - name: Ensure specified Homebrew cask apps are not installed
      community.general.homebrew_cask:
        name:
          - easy-move-plus-resize # Deprecated, replaced with Swift Shift
        state: absent
