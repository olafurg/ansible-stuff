---
- name: Set up macOS
  hosts: localhost
  vars_files:
    - vars/mas_apps.yml
  vars:
    homebrew_taps:
      - hashicorp/tap # Terraform

  # Base roles and non-Homebrew-Apps and/or apps which require config files to be arranged
  roles:
    - geerlingguy.mac.homebrew # Ensure homebrew is installed
    - geerlingguy.mac.mas # Ensure mas is installed, install Mac App Store apps via var file
    - oh_my_zsh
    - git
    - ghostty
    - asdf
    - terraform
    - tmux
    - vim

  # Homebrew apps that require no config files to be arranged
  tasks:
    - name: Install Homebrew (no-cask) apps
      community.general.homebrew:
        name:
          - awscli
          - azure-cli
          - gh
          - htop
          - tree
          - wget
        state: present

    - name: Install Homebrew cask apps
      community.general.homebrew_cask:
        name:
          - 1password
          - brave-browser
          - discord
          - firefox
          - flux
          - font-jetbrains-mono
          - raycast
          - rectangle
          - shottr
          - signal
          - spotify
          - swift-shift
          - visual-studio-code
        state: present

    - name: Ensure specified Homebrew cask apps are not installed
      community.general.homebrew_cask:
        name:
          - easy-move-plus-resize # Deprecated, replaced with SwiftShift
        state: absent
