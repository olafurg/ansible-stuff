---
- name: Upgrade Debian/Ubuntu
  hosts: debian_ubuntu
  become: true
  tasks:

    - name: Update apt package index
      apt:
        update_cache: yes
      register: update_result

    - name: Upgrade packages (safe upgrade)
      apt:
        upgrade: yes
      register: upgrade_result

    - name: Notify if packages were upgraded
      debug:
        msg: "Packages were upgraded: {{ upgrade_result }}"
      when: upgrade_result.changed

    - name: Check if a reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Notify if a reboot is required
      debug:
        msg: "A reboot is required to complete the updates."
      when: reboot_required.stat.exists

    - name: Notify if no reboot is required
      debug:
        msg: "No reboot is required."
      when: not reboot_required.stat.exists
