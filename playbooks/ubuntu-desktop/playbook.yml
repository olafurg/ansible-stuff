---
- name: Set up Ubuntu desktop localhost
  hosts: localhost
  connection: local
  tasks:

    - name: Install basic packages
      become: true
      apt:
        name:
          - ansible
          - vim
          - git
          - curl
          - htop
          - tree
          - traceroute
          - nmap
          - masscan
          - glances
          - whois
          - ttf-mscorefonts-installer
        state: latest
        update_cache: true

  roles:
    - 1password-debian-ubuntu-desktop
    - asdf
    - base-packages-debian
    - gh
    - git
    - oh_my_zsh
    - terraform
    - tmux
    - vim    
