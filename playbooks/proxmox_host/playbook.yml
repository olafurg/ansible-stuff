---
- name: Set up Proxmox host baseline
  hosts: proxmox_hosts
  become: true

  pre_tasks:
    - name: Disable Proxmox enterprise repository definitions when present
      ansible.builtin.command: mv {{ item }} {{ item }}.disabled
      args:
        creates: "{{ item }}.disabled"
        removes: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/ceph.sources

    - name: Configure Proxmox VE no-subscription repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

    - name: Configure Ceph no-subscription repository for Proxmox
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ceph-no-subscription.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/ceph-squid
          Suites: trixie
          Components: no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

  roles:
    - role: base_debian_server
      vars:
        base_debian_server_manage_firewall: false
